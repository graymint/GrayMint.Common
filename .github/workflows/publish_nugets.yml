name: Publish NuGets

# Build -> test -> bump -> pack run in the reusable pack_nugets.yml; this file only pushes the
# packages to nuget.org. Every GrayMint repo carries this same file (only the pack job's `uses:`
# differs: other repos reference graymint/GrayMint.Common/...@main).
#
# nuget.org Trusted Publishing, no stored key: a policy on nuget.org names this repo and this
# file's NAME, so renaming the file breaks publishing. The NuGet profile that owns the policy comes
# from the org secret NUGET_USER. See docs/versioning-and-nuget-updates.md.
#
# Triggers:
#   - push to main: every merged change publishes a new patch version.
#   - workflow_dispatch: manual (re)publish, and the chain target of update_nugets.yml (a push made
#     with GITHUB_TOKEN does not retrigger workflows, so the updater dispatches this explicitly).

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write # push the bump commit to main

jobs:
  pack-nugets:
    uses: ./.github/workflows/pack_nugets.yml

  push-nugets:
    needs: pack-nugets
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for nuget.org Trusted Publishing
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nupkgs
          path: nupkgs

      # The key is valid for one hour, so it is requested right before the push.
      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: dotnet nuget push "nupkgs/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
